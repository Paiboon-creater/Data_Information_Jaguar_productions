<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JAGUAR_PRODUCTION</title>
    <link href="https://fonts.googleapis.com/css2?family=Prompt:wght@300;400;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        :root {
            --neon-green: #00ff66;
            --dark-green: #0a1f14;
            --glass-bg: rgba(10, 31, 20, 0.7);
            --glass-border: rgba(0, 255, 102, 0.3);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Prompt', sans-serif;
        }

        body {
            background-color: var(--dark-green);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            overflow-x: hidden;
        }

        .app-container {
            width: 100%;
            max-width: 420px;
            min-height: 100vh;
            background: linear-gradient(to bottom, rgba(5, 25, 15, 0.85), rgba(10, 35, 20, 0.95)), 
                        url('https://images.unsplash.com/photo-1590794056226-79ef3a8147e1?q=80&w=1000') no-repeat center center;
            background-size: cover;
            position: relative;
            box-shadow: 0 0 30px rgba(0, 0, 0, 0.8);
            padding: 30px 20px;
            display: flex;
            flex-direction: column;
        }

        header {
            text-align: center;
            margin-bottom: 30px;
        }

        .logo-container {
            width: 110px;
            height: 110px;
            margin: 0 auto 15px;
            background: #000;
            border-radius: 50%;
            border: 2px solid var(--neon-green);
            box-shadow: 0 0 15px var(--glass-border), 0 0 20px rgba(255, 215, 0, 0.2);
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
        }

        .logo-container img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        h1 {
            color: #ffffff;
            font-size: 1.2rem;
            font-weight: 600;
            letter-spacing: 2px;
            text-transform: uppercase;
            text-shadow: 0 0 10px rgba(0, 255, 102, 0.5);
        }

        .subtitle {
            color: var(--neon-green);
            font-size: 0.8rem;
            margin-top: 5px;
            font-weight: 300;
        }

        .menu-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 15px;
            flex-grow: 1;
        }

        .menu-btn {
            background: var(--glass-bg);
            border: 1px solid var(--glass-border);
            border-radius: 16px;
            padding: 20px 10px;
            text-decoration: none;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
            transition: all 0.3s ease;
            backdrop-filter: blur(5px);
            -webkit-backdrop-filter: blur(5px);
            position: relative;
            overflow: hidden;
        }

        /* ปรับให้ปุ่มที่ 9 ขยายเต็ม 2 ช่อง เพื่อความสมดุล */
        .menu-btn:nth-child(9) {
            grid-column: span 2;
        }

        .menu-btn i {
            font-size: 2rem;
            color: #b3ffcc;
            margin-bottom: 12px;
            transition: all 0.3s ease;
            filter: drop-shadow(0 0 5px rgba(0,255,102,0.5));
        }

        .menu-btn span {
            color: #ffffff;
            font-size: 0.85rem;
            font-weight: 400;
            line-height: 1.3;
            transition: all 0.3s ease;
        }

        .menu-btn:hover, .menu-btn:active {
            background: rgba(0, 255, 102, 0.1);
            border-color: var(--neon-green);
            box-shadow: 0 0 20px rgba(0, 255, 102, 0.4), inset 0 0 15px rgba(0, 255, 102, 0.2);
            transform: translateY(-2px) scale(0.98);
        }

        .menu-btn:active i, .menu-btn:hover i {
            color: var(--neon-green);
            transform: scale(1.1);
            filter: drop-shadow(0 0 15px var(--neon-green));
        }

        .menu-btn:active span, .menu-btn:hover span {
            color: var(--neon-green);
            text-shadow: 0 0 5px rgba(0, 255, 102, 0.8);
        }

        .menu-btn::before {
            content: '';
            position: absolute;
            top: 0; left: -100%;
            width: 100%; height: 2px;
            background: linear-gradient(90deg, transparent, var(--neon-green));
            transition: all 0.5s ease;
        }

        .menu-btn:hover::before {
            left: 100%;
        }

    </style>
</head>
<body>

    <div class="app-container">
        <header>
            <div class="logo-container">
                <img src="https://img.freepik.com/premium-vector/black-golden-aura-unique-golden-roaring-lion-face-front-view-logo-vector-radiating-luxury_764382-146929.jpg?w=2000" alt="Jaguar Golden Logo">
            </div>
            <h1>JAGUAR PRODUCTION</h1>
            <div class="subtitle">■ SYSTEM DASHBOARD ■</div>
        </header>

        <div class="menu-grid">
            <!-- 1. เพิ่มใบสั่ง -->
            <a href="https://paiboon-creater.github.io/new_order/" class="menu-btn">
                <i class="fa-solid fa-file-pen"></i>
                <span>เพิ่มใบสั่ง</span>
            </a>

            <!-- 2. วางแผนขั้นตอนทำงาน -->
            <a href="https://paiboon-creater.github.io/Plan_Step/" class="menu-btn">
                <i class="fa-solid fa-folder-tree"></i>
                <span>วางแผน<br>ขั้นตอนทำงาน</span>
            </a>

            <!-- 3. เพิ่มชื่อพนักงาน -->
            <a href="https://paiboon-creater.github.io/Operation/" class="menu-btn">
                <i class="fa-solid fa-address-book"></i>
                <span>เพิ่มชื่อพนักงาน</span>
            </a>

            <!-- 4. ตั้งยอดมาตรฐาน -->
            <a href="https://paiboon-creater.github.io/target/" class="menu-btn">
                <i class="fa-solid fa-chart-column"></i>
                <span>ตั้งยอดมาตรฐาน</span>
            </a>

            <!-- 5. ป้อนข้อมูลผลิตรายวัน -->
            <a href="https://paiboon-creater.github.io/daily-production/" class="menu-btn">
                <i class="fa-solid fa-chart-line"></i>
                <span>ป้อนข้อมูลผลิตรายวัน<br>(พิมพ์ใบมิเตอร์)</span>
            </a>

            <!-- 6. Status_report -->
            <a href="https://paiboon-creater.github.io/status_report/" class="menu-btn">
                <i class="fa-solid fa-magnifying-glass-chart"></i>
                <span>Status Report</span>
            </a>

            <!-- 7. แกนต์ชาร์ต วางแผนงาน -->
            <a href="https://paiboon-creater.github.io/gantt_chart/" class="menu-btn">
                <i class="fa-solid fa-chart-gantt"></i>
                <span>แกนต์ชาร์ต<br>วางแผนงาน</span>
            </a>

            <!-- 8. กระดานรายงาน (Report Board) -->
            <a href="https://paiboon-creater.github.io/report_bord/" class="menu-btn">
                <i class="fa-solid fa-table-columns"></i>
                <span>กระดานรายงาน<br>(Report Board)</span>
            </a>

            <!-- 9. รายงานต้นทุนการผลิต (Cost Matrix) -->
            <a href="https://paiboon-creater.github.io/cost_per_unit_report/" class="menu-btn">
                <i class="fa-solid fa-coins"></i>
                <span>รายงานต้นทุนการผลิต<br>(Cost Report)</span>
            </a>
        </div>
    </div>

</body>
</html>
